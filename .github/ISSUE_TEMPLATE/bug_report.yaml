name: 🐛 Bug report
description: Report a bug to help us improve Smart-NESMA
title: "[Bug]: "
labels: [bug]
assignees:
  - coder-lulu
body:
  - type: input
    id: version
    attributes:
      label: Smart-NESMA 版本
      description: 请输入您当前使用的项目版本?
      placeholder: main 分支提交 SHA 或版本号
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node 版本
      description: 请输入您当前使用的NODE版本?
      placeholder: v22.x
    validations:
      required: true
  - type: input
    id: golang
    attributes:
      label: Golang 版本
      description: 请输入您当前使用的GOLANG版本?
      placeholder: go 1.23.9
    validations:
      required: true
  - type: dropdown
    id: reappearance
    attributes:
      label: 是否依旧存在
      description: 是否可以在main 分支复现此bug?
      options:
        - 可以
        - 不可以
        - 未测试
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: bug描述
      description: 请简要描述bug以及复现过程.
      placeholder: |
        1. 首先...
        2. 然后...
    validations:
      required: true
  - type: textarea
    id: advise
    attributes:
      label: 修改建议
      description: 您有好的建议或者修改方案可以提供给我们。
